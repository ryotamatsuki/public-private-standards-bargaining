name: stage17-full-history-treaty-majority-spe
on:
  push:
    paths:
      - code/stage17_full_history_treaty_spe_majority.py
      - code/stage16_three_country_treaty_sidepayments_spe.py
      - code/stage15_three_country_veto_minimal_continuous_spe.py
      - code/stage14_institutional_veto_ablation.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage17-full-history-treaty-majority-spe.yml
  pull_request:
    paths:
      - code/stage17_full_history_treaty_spe_majority.py
      - code/stage16_three_country_treaty_sidepayments_spe.py
      - code/stage15_three_country_veto_minimal_continuous_spe.py
      - code/stage14_institutional_veto_ablation.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage17-full-history-treaty-majority-spe.yml
permissions:
  contents: read
jobs:
  exact-all-history-pledge-continuation-and-full-continuous-spe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage14_institutional_veto_ablation.py
      - run: python code/stage15_three_country_veto_minimal_continuous_spe.py
      - run: python code/stage16_three_country_treaty_sidepayments_spe.py
      - run: python code/stage17_full_history_treaty_spe_majority.py
