name: stage5-kkt-selection-phases
on:
  push:
    paths:
      - code/stage5_kkt_selection_phases.py
      - requirements.txt
      - .github/workflows/stage5-kkt-selection-phases.yml
  pull_request:
    paths:
      - code/stage5_kkt_selection_phases.py
      - requirements.txt
      - .github/workflows/stage5-kkt-selection-phases.yml
permissions:
  contents: read
jobs:
  exact-phase-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage5_kkt_selection_phases.py
