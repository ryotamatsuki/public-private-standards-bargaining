name: stage0-three-authority-regimes
on:
  push:
    paths:
      - code/stage0_three_authority_regimes.py
      - requirements.txt
      - .github/workflows/stage0-three-authority-regimes.yml
  pull_request:
    paths:
      - code/stage0_three_authority_regimes.py
      - requirements.txt
      - .github/workflows/stage0-three-authority-regimes.yml
permissions:
  contents: read
jobs:
  certify-institutions-and-override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage0_three_authority_regimes.py
