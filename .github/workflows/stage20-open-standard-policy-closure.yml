name: stage20-open-standard-policy-closure
on:
  push:
    paths:
      - code/stage20_singleton_triple_open_regulatory_classification.py
      - code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - code/stage18_agenda_control_majority_coalition_spe.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage20-open-standard-policy-closure.yml
  pull_request:
    paths:
      - code/stage20_singleton_triple_open_regulatory_classification.py
      - code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - code/stage18_agenda_control_majority_coalition_spe.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage20-open-standard-policy-closure.yml
permissions:
  contents: read
jobs:
  exact-national-open-technology-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - run: python code/stage20_singleton_triple_open_regulatory_classification.py
