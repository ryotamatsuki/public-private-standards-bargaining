name: stage6-full-continuous-mixed-spe
on:
  push:
    paths:
      - code/stage6_full_continuous_mixed_spe_certification.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage6-full-continuous-mixed-spe.yml
  pull_request:
    paths:
      - code/stage6_full_continuous_mixed_spe_certification.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage6-full-continuous-mixed-spe.yml
permissions:
  contents: read
jobs:
  certify-mixed-continuations-and-continuous-ns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage6_full_continuous_mixed_spe_certification.py
