name: stage8-capitalized-retrofit-continuous-is-spe
on:
  push:
    paths:
      - code/stage8_capitalized_retrofit_continuous_is_spe.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage8-capitalized-retrofit-continuous-is-spe.yml
  pull_request:
    paths:
      - code/stage8_capitalized_retrofit_continuous_is_spe.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage8-capitalized-retrofit-continuous-is-spe.yml
permissions:
  contents: read
jobs:
  exact-all-continuous-is-mandate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage8_capitalized_retrofit_continuous_is_spe.py
