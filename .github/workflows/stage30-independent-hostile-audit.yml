name: Stage30 independent audit evidence (editorial NO-GO)

on:
  pull_request:
    paths:
      - 'code/stage30_*'
      - 'docs/audit/STAGE30_*'
      - '.github/workflows/stage30-independent-hostile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/stage30_requirements.txt
      - run: python -m pip install -r code/stage30_requirements.txt
      - run: python code/stage30_independent_exact_audit.py
      - run: python code/stage30_independent_game_audit.py
      - run: python code/stage30_audit_manifest_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage30-independent-audit-evidence
          path: docs/audit/STAGE30_INDEPENDENT_*RESULTS.json
          retention-days: 7
