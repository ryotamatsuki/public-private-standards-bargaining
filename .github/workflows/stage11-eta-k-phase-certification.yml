name: stage11-eta-k-phase-certification
on:
  push:
    paths:
      - code/stage11_eta_k_phase_certificates.py
      - code/stage10_positive_design_endogenous_public_depth_spe.py
      - requirements.txt
      - .github/workflows/stage11-eta-k-phase-certification.yml
  pull_request:
    paths:
      - code/stage11_eta_k_phase_certificates.py
      - code/stage10_positive_design_endogenous_public_depth_spe.py
      - requirements.txt
      - .github/workflows/stage11-eta-k-phase-certification.yml
permissions:
  contents: read
jobs:
  proof-exact-bifurcation-two-dimensional-spe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage11_eta_k_phase_certificates.py
