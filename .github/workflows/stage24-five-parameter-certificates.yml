name: stage24-five-parameter-certificates
on:
  push:
    paths:
      - code/stage24_five_parameter_full_spe_certificate.py
      - docs/institutions/STAGE24_FIVE_PARAMETER_SPE_ROBUSTNESS_20261014.md
      - .github/workflows/stage24-five-parameter-certificates.yml
  pull_request:
    paths:
      - code/stage24_five_parameter_full_spe_certificate.py
      - docs/institutions/STAGE24_FIVE_PARAMETER_SPE_ROBUSTNESS_20261014.md
      - .github/workflows/stage24-five-parameter-certificates.yml
permissions:
  contents: read
jobs:
  five-parameter-global-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - run: python code/stage20_singleton_triple_open_regulatory_classification.py
      - run: python code/stage21_three_open_global_no_private_spe.py
      - run: python code/stage22_exact_phi_robustness.py
      - run: python code/stage23_full_spe_phi_interval.py
      - run: python code/stage24_five_parameter_full_spe_certificate.py
