name: stage4a-independent-spne-strong-redteam
on:
  push:
    paths:
      - 'code/stage4a_independent_game_redteam.py'
      - 'requirements.txt'
      - '.github/workflows/stage4a-independent-spne-strong-redteam.yml'
  pull_request:
    paths:
      - 'code/stage4a_independent_game_redteam.py'
      - 'requirements.txt'
      - '.github/workflows/stage4a-independent-spne-strong-redteam.yml'
permissions:
  contents: read
jobs:
  clean-room-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage4a_independent_game_redteam.py
