name: stage4-exit-boundary-private-veto
on:
  push:
    paths:
      - 'code/stage4_exit_boundary_pinning.py'
      - 'requirements.txt'
      - '.github/workflows/stage4-exit-boundary-private-veto.yml'
  pull_request:
    paths:
      - 'code/stage4_exit_boundary_pinning.py'
      - 'requirements.txt'
      - '.github/workflows/stage4-exit-boundary-private-veto.yml'
permissions:
  contents: read
jobs:
  exact-boundary-private-veto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage4_exit_boundary_pinning.py
