name: stage4a-cleanroom-strong-correspondence
on:
  push:
    paths:
      - code/stage4a_cleanroom_strong_correspondence.py
      - requirements.txt
      - .github/workflows/stage4a-cleanroom-strong-correspondence.yml
  pull_request:
    paths:
      - code/stage4a_cleanroom_strong_correspondence.py
      - requirements.txt
      - .github/workflows/stage4a-cleanroom-strong-correspondence.yml
permissions:
  contents: read
jobs:
  independent-kkt-strong-outcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage4a_cleanroom_strong_correspondence.py
