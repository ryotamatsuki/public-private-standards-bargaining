name: stage3-outsider-exit-reentry
on:
  push:
    paths:
      - 'code/stage3_outsider_reentry_theorem.py'
      - 'requirements.txt'
      - '.github/workflows/stage3-outsider-exit-reentry.yml'
  pull_request:
    paths:
      - 'code/stage3_outsider_reentry_theorem.py'
      - 'requirements.txt'
      - '.github/workflows/stage3-outsider-exit-reentry.yml'
permissions:
  contents: read
jobs:
  exact-exit-reentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage3_outsider_reentry_theorem.py
