name: six-dimensional-equilibrium-corners
on:
  push:
    paths:
      - 'code/verify_six_dimensional_corners.py'
      - 'code/verify_six_dimensional_exclusion.py'
      - 'requirements.txt'
      - '.github/workflows/six-dimensional-equilibrium-corners.yml'
  pull_request:
    paths:
      - 'code/verify_six_dimensional_corners.py'
      - 'requirements.txt'
      - '.github/workflows/six-dimensional-equilibrium-corners.yml'
permissions:
  contents: read
jobs:
  algebraic-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_six_dimensional_corners.py
      - run: python code/verify_six_dimensional_exclusion.py
