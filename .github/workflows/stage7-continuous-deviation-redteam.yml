name: stage7-continuous-deviation-redteam
on:
  push:
    paths:
      - code/stage7_continuous_deviation_redteam.py
      - code/stage5_integrated_independent_standards_and_government.py
      - .github/workflows/stage7-continuous-deviation-redteam.yml
  pull_request:
    paths:
      - code/stage7_continuous_deviation_redteam.py
      - code/stage5_integrated_independent_standards_and_government.py
      - .github/workflows/stage7-continuous-deviation-redteam.yml
permissions:
  contents: read
jobs:
  adversarial-continuous-deviation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python code/stage7_continuous_deviation_redteam.py
