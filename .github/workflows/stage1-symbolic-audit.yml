name: stage1-symbolic-audit
on:
  push:
    paths:
      - 'code/verify_stage1.py'
      - 'requirements.txt'
      - '.github/workflows/stage1-symbolic-audit.yml'
  pull_request:
    paths:
      - 'code/verify_stage1.py'
      - 'requirements.txt'
      - '.github/workflows/stage1-symbolic-audit.yml'
permissions:
  contents: read
jobs:
  sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_stage1.py
