name: stage9-full-continuous-rs-is-coexistence
on:
  push:
    paths:
      - code/stage9_full_continuous_rs_is_coexistence_spe.py
      - code/stage8_capitalized_retrofit_continuous_is_spe.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage9-full-continuous-rs-is-coexistence.yml
  pull_request:
    paths:
      - code/stage9_full_continuous_rs_is_coexistence_spe.py
      - code/stage8_capitalized_retrofit_continuous_is_spe.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage9-full-continuous-rs-is-coexistence.yml
permissions:
  contents: read
jobs:
  exact-six-player-full-continuous-rs-and-is:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage9_full_continuous_rs_is_coexistence_spe.py
