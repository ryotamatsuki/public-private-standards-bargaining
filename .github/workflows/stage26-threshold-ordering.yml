name: stage26-threshold-ordering
on:
  push:
    paths:
      - code/stage26_nested_policy_welfare_cutoffs.py
      - docs/institutions/STAGE26_NESTED_POLICY_AND_WELFARE_THRESHOLDS_20261014.md
      - .github/workflows/stage26-threshold-ordering.yml
  pull_request:
    paths:
      - code/stage26_nested_policy_welfare_cutoffs.py
      - docs/institutions/STAGE26_NESTED_POLICY_AND_WELFARE_THRESHOLDS_20261014.md
      - .github/workflows/stage26-threshold-ordering.yml
permissions:
  contents: read
jobs:
  nested-policy-thresholds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy mpmath
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage14_institutional_veto_ablation.py
      - run: python code/stage15_three_country_veto_minimal_continuous_spe.py
      - run: python code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - run: python code/stage23_full_spe_phi_interval.py
      - run: python code/stage25_seven_parameter_norm_robustness.py
      - run: python code/stage26_nested_policy_welfare_cutoffs.py
