name: stage27-agenda-transversal
on:
  push:
    paths:
      - code/stage27_agenda_hitting_set_spe_classification.py
      - docs/institutions/STAGE27_SHARP_MINIMUM_AGENDA_RIGHTS_20261014.md
      - .github/workflows/stage27-agenda-transversal.yml
  pull_request:
    paths:
      - code/stage27_agenda_hitting_set_spe_classification.py
      - docs/institutions/STAGE27_SHARP_MINIMUM_AGENDA_RIGHTS_20261014.md
      - .github/workflows/stage27-agenda-transversal.yml
permissions:
  contents: read
jobs:
  exact-agenda-quorum-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy mpmath
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage15_three_country_veto_minimal_continuous_spe.py
      - run: python code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - run: python code/stage21_three_open_global_no_private_spe.py
      - run: python code/stage25_seven_parameter_norm_robustness.py
      - run: python code/stage26_nested_policy_welfare_cutoffs.py
      - run: python code/stage27_agenda_hitting_set_spe_classification.py
