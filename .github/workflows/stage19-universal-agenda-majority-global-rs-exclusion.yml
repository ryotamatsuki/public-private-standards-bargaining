name: stage19-universal-agenda-majority-global-rs-exclusion
on:
  push:
    paths:
      - code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - code/stage18_agenda_control_majority_coalition_spe.py
      - code/stage17_full_history_treaty_spe_majority.py
      - code/stage14_institutional_veto_ablation.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage19-universal-agenda-majority-global-rs-exclusion.yml
  pull_request:
    paths:
      - code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
      - code/stage18_agenda_control_majority_coalition_spe.py
      - code/stage17_full_history_treaty_spe_majority.py
      - code/stage14_institutional_veto_ablation.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage19-universal-agenda-majority-global-rs-exclusion.yml
permissions:
  contents: read
jobs:
  exact-fully-continuous-asymmetric-bilateral-rs-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage14_institutional_veto_ablation.py
      - run: python code/stage18_agenda_control_majority_coalition_spe.py
      - run: python code/stage19_universal_agenda_majority_global_two_firm_rs_exclusion.py
