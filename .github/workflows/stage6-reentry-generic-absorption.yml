name: stage6-reentry-generic-absorption
on:
  push:
    paths:
      - 'code/stage6_reentry_generic_absorption.py'
      - 'requirements.txt'
      - '.github/workflows/stage6-reentry-generic-absorption.yml'
  pull_request:
    paths:
      - 'code/stage6_reentry_generic_absorption.py'
      - 'requirements.txt'
      - '.github/workflows/stage6-reentry-generic-absorption.yml'
permissions:
  contents: read
jobs:
  cleanroom-economic-novelty-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage6_reentry_generic_absorption.py
