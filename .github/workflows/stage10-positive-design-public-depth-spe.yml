name: stage10-positive-design-public-depth-spe
on:
  push:
    paths:
      - code/stage10_positive_design_endogenous_public_depth_spe.py
      - code/stage8_capitalized_retrofit_continuous_is_spe.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage10-positive-design-public-depth-spe.yml
  pull_request:
    paths:
      - code/stage10_positive_design_endogenous_public_depth_spe.py
      - code/stage8_capitalized_retrofit_continuous_is_spe.py
      - code/stage5_integrated_independent_standards_and_government.py
      - requirements.txt
      - .github/workflows/stage10-positive-design-public-depth-spe.yml
permissions:
  contents: read
jobs:
  exact-positive-common-design-and-public-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage10_positive_design_endogenous_public_depth_spe.py
