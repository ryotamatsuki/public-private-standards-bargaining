name: stage2-endogenous-design-nested-regulation
on:
  push:
    paths:
      - code/stage2_endogenous_design_nested_regulation.py
      - requirements.txt
      - .github/workflows/stage2-endogenous-design-nested-regulation.yml
  pull_request:
    paths:
      - code/stage2_endogenous_design_nested_regulation.py
      - requirements.txt
      - .github/workflows/stage2-endogenous-design-nested-regulation.yml
permissions:
  contents: read
jobs:
  exact-design-and-regulatory-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage2_endogenous_design_nested_regulation.py
