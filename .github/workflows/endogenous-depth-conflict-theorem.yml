name: endogenous-depth-conflict-theorem
on:
  push:
    paths:
      - 'code/verify_endogenous_depth_conflict_theorem.py'
      - 'requirements.txt'
      - '.github/workflows/endogenous-depth-conflict-theorem.yml'
  pull_request:
    paths:
      - 'code/verify_endogenous_depth_conflict_theorem.py'
      - 'requirements.txt'
      - '.github/workflows/endogenous-depth-conflict-theorem.yml'
permissions:
  contents: read
jobs:
  exact-theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_endogenous_depth_conflict_theorem.py
