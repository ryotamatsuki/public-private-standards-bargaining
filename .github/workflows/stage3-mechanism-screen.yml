name: stage3-mechanism-screen
on:
  push:
    paths:
      - 'code/verify_stage3_mechanisms.py'
      - 'requirements.txt'
      - '.github/workflows/stage3-mechanism-screen.yml'
  pull_request:
    paths:
      - 'code/verify_stage3_mechanisms.py'
      - 'requirements.txt'
      - '.github/workflows/stage3-mechanism-screen.yml'
permissions:
  contents: read
jobs:
  exact-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_stage3_mechanisms.py
