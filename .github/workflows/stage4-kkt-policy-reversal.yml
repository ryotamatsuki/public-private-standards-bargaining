name: stage4-kkt-policy-reversal
on:
  push:
    paths:
      - 'code/stage4_exit_boundary_policy_reversal.py'
      - 'requirements.txt'
      - '.github/workflows/stage4-kkt-policy-reversal.yml'
  pull_request:
    paths:
      - 'code/stage4_exit_boundary_policy_reversal.py'
      - 'requirements.txt'
      - '.github/workflows/stage4-kkt-policy-reversal.yml'
permissions:
  contents: read
jobs:
  exact-kkt-policy-reversal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage4_exit_boundary_policy_reversal.py
