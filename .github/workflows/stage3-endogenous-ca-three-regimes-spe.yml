name: stage3-endogenous-ca-three-regimes-spe
on:
  push:
    paths:
      - code/stage3_endogenous_ca_regime_spe.py
      - requirements.txt
      - .github/workflows/stage3-endogenous-ca-three-regimes-spe.yml
  pull_request:
    paths:
      - code/stage3_endogenous_ca_regime_spe.py
      - requirements.txt
      - .github/workflows/stage3-endogenous-ca-three-regimes-spe.yml
permissions:
  contents: read
jobs:
  exact-all-continuous-regime-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage3_endogenous_ca_regime_spe.py
