name: stage1-endogenous-development-certification-spe
on:
  push:
    paths:
      - code/stage1_endogenous_private_development_public_certification_spe.py
      - requirements.txt
      - .github/workflows/stage1-endogenous-development-certification-spe.yml
  pull_request:
    paths:
      - code/stage1_endogenous_private_development_public_certification_spe.py
      - requirements.txt
      - .github/workflows/stage1-endogenous-development-certification-spe.yml
permissions:
  contents: read
jobs:
  exact-sequential-spe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/stage1_endogenous_private_development_public_certification_spe.py
