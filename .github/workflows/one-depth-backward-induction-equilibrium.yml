name: one-depth-backward-induction-equilibrium
on:
  push:
    paths:
      - 'code/verify_backward_general.py'
      - 'requirements.txt'
      - '.github/workflows/one-depth-backward-induction-equilibrium.yml'
  pull_request:
    paths:
      - 'code/verify_backward_general.py'
      - 'requirements.txt'
      - '.github/workflows/one-depth-backward-induction-equilibrium.yml'
permissions:
  contents: read
jobs:
  mathematical-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_backward_general.py
