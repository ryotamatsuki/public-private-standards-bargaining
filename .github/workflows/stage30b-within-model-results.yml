name: Stage30B unchanged-model construction evidence

on:
  pull_request:
    paths:
      - 'code/stage30b_*'
      - 'docs/audit/STAGE30B_*'
      - '.github/workflows/stage30b-within-model-results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  within-model-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            code/stage30_requirements.txt
            code/stage30b_requirements.txt
      - run: python -m pip install -r code/stage30b_requirements.txt
      - run: python code/stage30b_within_model_exact.py
      - run: python code/stage30b_within_model_numeric.py
      - run: python code/stage30b_plot.py
      - run: python code/stage30b_evidence_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage30b-construction-evidence
          path: |
            docs/audit/STAGE30B_*RESULTS.json
            docs/audit/STAGE30B_EQUILIBRIUM_WELFARE.svg
          retention-days: 7
