name: ns-rs-is-cournot-bargaining
on:
  push:
    paths:
      - 'code/verify_ns_rs_is.py'
      - 'requirements.txt'
      - '.github/workflows/ns-rs-is-cournot-bargaining.yml'
  pull_request:
    paths:
      - 'code/verify_ns_rs_is.py'
      - 'requirements.txt'
      - '.github/workflows/ns-rs-is-cournot-bargaining.yml'
permissions:
  contents: read
jobs:
  proof-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_ns_rs_is.py
