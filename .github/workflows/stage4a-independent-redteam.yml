name: stage4a-independent-redteam
on:
  push:
    paths:
      - 'code/verify_stage4a_redteam.py'
      - 'requirements.txt'
      - '.github/workflows/stage4a-independent-redteam.yml'
  pull_request:
    paths:
      - 'code/verify_stage4a_redteam.py'
      - 'requirements.txt'
      - '.github/workflows/stage4a-independent-redteam.yml'
permissions:
  contents: read
jobs:
  independent-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_stage4a_redteam.py
