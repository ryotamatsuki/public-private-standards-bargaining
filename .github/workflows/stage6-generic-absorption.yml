name: stage6-generic-absorption
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generic-veto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_stage6_generic_veto_absorption.py
