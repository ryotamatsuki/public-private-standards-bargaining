name: Stage30C independent added-results audit

on:
  pull_request:
    paths:
      - 'code/stage30c_*'
      - 'docs/audit/STAGE30C_*'
      - '.github/workflows/stage30c-independent-added-results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/stage30c_requirements.txt
      - run: python -m pip install -r code/stage30c_requirements.txt
      - run: python code/stage30c_independent_exact.py
      - run: python code/stage30c_independent_numeric.py
      - run: python code/stage30c_independent_boundary.py
      - run: python code/stage30c_reconcile.py
      - run: python code/stage30c_evidence_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage30c-independent-evidence
          path: docs/audit/STAGE30C_*RESULTS.json
          retention-days: 14
