name: stage14-national-veto-institutional-ablation
on:
  push:
    paths:
      - code/stage14_institutional_veto_ablation.py
      - .github/workflows/stage14-national-veto-institutional-ablation.yml
  pull_request:
    paths:
      - code/stage14_institutional_veto_ablation.py
      - .github/workflows/stage14-national-veto-institutional-ablation.yml
permissions:
  contents: read
jobs:
  exact-institutional-mechanism-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python code/stage14_institutional_veto_ablation.py
