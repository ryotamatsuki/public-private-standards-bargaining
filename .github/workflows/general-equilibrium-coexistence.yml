name: general-equilibrium-coexistence
on:
  push:
    paths:
      - 'code/verify_general_standard_coexistence.py'
      - 'requirements.txt'
      - '.github/workflows/general-equilibrium-coexistence.yml'
  pull_request:
    paths:
      - 'code/verify_general_standard_coexistence.py'
      - 'requirements.txt'
      - '.github/workflows/general-equilibrium-coexistence.yml'
permissions:
  contents: read
jobs:
  exact-parametric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_general_standard_coexistence.py
