name: stage30l-prewriting-argument-inventory
on:
  pull_request:
    paths:
      - 'docs/audit/STAGE30L_*'
      - 'code/stage30l_structure_gate.py'
      - '.github/workflows/stage30l-prewriting-argument-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  non-gating-paper-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pre-writing documents and scoped economic assertions
        run: python code/stage30l_structure_gate.py
