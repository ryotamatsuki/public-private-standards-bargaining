name: stage6-nested-absorption
on:
  push:
    paths:
      - 'code/verify_stage6_nested.py'
      - 'requirements.txt'
      - '.github/workflows/stage6-nested-absorption.yml'
  pull_request:
    paths:
      - 'code/verify_stage6_nested.py'
      - 'requirements.txt'
      - '.github/workflows/stage6-nested-absorption.yml'
permissions:
  contents: read
jobs:
  theorem-absorption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_stage6_nested.py
