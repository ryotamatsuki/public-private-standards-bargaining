name: stage30m-fullpaper-editorial-review-inventory
on:
  pull_request:
    paths:
      - 'docs/audit/STAGE30M_*'
      - 'code/stage30m_editorial_inventory.py'
      - '.github/workflows/stage30m-fullpaper-editorial-review-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  non-gating-editorial-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python code/stage30m_editorial_inventory.py
