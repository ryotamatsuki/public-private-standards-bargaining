name: spne-versus-stage1-strong-refinement
on:
  push:
    paths:
      - 'code/verify_spne_vs_stage1_strong.py'
      - 'code/verify_pure_spne_complete.py'
      - 'code/verify_six_dimensional_corners.py'
      - 'requirements.txt'
      - '.github/workflows/spne-versus-stage1-strong-refinement.yml'
  pull_request:
    paths:
      - 'code/verify_spne_vs_stage1_strong.py'
      - 'code/verify_pure_spne_complete.py'
      - 'code/verify_six_dimensional_corners.py'
      - 'requirements.txt'
      - '.github/workflows/spne-versus-stage1-strong-refinement.yml'
permissions:
  contents: read
jobs:
  exact-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_pure_spne_complete.py
      - run: python code/verify_spne_vs_stage1_strong.py
