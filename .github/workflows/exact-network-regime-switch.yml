name: exact-network-regime-switch
on:
  push:
    paths:
      - 'code/verify_network_switch_exact.py'
      - 'requirements.txt'
      - '.github/workflows/exact-network-regime-switch.yml'
  pull_request:
    paths:
      - 'code/verify_network_switch_exact.py'
      - 'requirements.txt'
      - '.github/workflows/exact-network-regime-switch.yml'
permissions:
  contents: read
jobs:
  exact-inequalities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python code/verify_network_switch_exact.py
