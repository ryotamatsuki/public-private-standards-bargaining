name: stage18-majority-agenda-control-rs-spe
on:
  push:
    paths:
      - code/stage18_agenda_control_majority_coalition_spe.py
      - code/stage17_full_history_treaty_spe_majority.py
      - code/stage15_three_country_veto_minimal_continuous_spe.py
      - code/stage14_institutional_veto_ablation.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage18-majority-agenda-control-rs-spe.yml
  pull_request:
    paths:
      - code/stage18_agenda_control_majority_coalition_spe.py
      - code/stage17_full_history_treaty_spe_majority.py
      - code/stage15_three_country_veto_minimal_continuous_spe.py
      - code/stage14_institutional_veto_ablation.py
      - code/stage11_eta_k_phase_certificates.py
      - .github/workflows/stage18-majority-agenda-control-rs-spe.yml
permissions:
  contents: read
jobs:
  three-country-agenda-vs-majority-continuous-spe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: python code/stage11_eta_k_phase_certificates.py
      - run: python code/stage14_institutional_veto_ablation.py
      - run: python code/stage17_full_history_treaty_spe_majority.py
      - run: python code/stage18_agenda_control_majority_coalition_spe.py
